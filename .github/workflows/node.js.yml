# Node.js CI untuk SQLite-Model-Builder
name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependensi
        run: |
          npm ci || npm install
          # Pastikan dependensi peer ikut terpasang
          npm install sqlite sqlite3 --no-save

      - name: Jalankan test
        run: npm test

      - name: Build sukses
        run: echo "✅ CI sukses untuk Node.js versi ${{ matrix.node-version }}"
